name: Bid alerts worker
# Collects new GeM bids, queues matches, sends app notifications and email digests.
# Off until the repository variable BID_WORKER_ENABLED is set to "true".
# Hourly keeps a private repo inside GitHub's free Actions minutes; switch
# to '*/15 * * * *' (or Render, render.yaml) for faster alerts.
on:
  schedule:
    - cron: '7 * * * *'   # minute 7 of every hour (UTC), off the busy :00
  workflow_dispatch:
concurrency:
  group: bid-worker
  cancel-in-progress: false
jobs:
  run:
    if: vars.BID_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-worker.txt
      - run: pip install -r scripts/requirements-worker.txt
      - run: python scripts/bid_worker.py run --max-documents 300 --min-gap-minutes 60 --email-gap-hours 12 --whatsapp-gap-hours 24
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE: ${{ vars.WHATSAPP_TEMPLATE }}
